name: Supabase deploy (release stage)

# Applies migrations from Git and deploys Edge Functions to the linked hosted project.
# Reusable workflow ONLY: it has no trigger of its own (no workflow_dispatch, no push), so it runs exclusively as the
# `supabase` job of .github/workflows/release.yml — after that workflow's preflight (main, SHA, CI green, backup,
# migration integrity, protected environments) — and the guard below refuses any other caller.
#
# Concurrency: deliberately NONE here. The caller holds the single production-release group (release.yml); a second
# group with the same name in a called workflow would deadlock, a different one would split the serialisation.
# Checked by scripts/lib/workflows.test.ts.
on:
  workflow_call:
    inputs:
      sha:
        description: Full SHA validated by the release preflight; the exact commit that is checked out and deployed.
        required: true
        type: string
    # A called workflow's `secrets` context holds ONLY the names its caller passes — even the job's own `production`
    # environment secrets stay empty unless their name is passed here (with `environment:` on the job, GitHub then
    # resolves the environment's value, not the caller's). Without this list SUPABASE_ACCESS_TOKEN reached the CLI empty
    # ("Access token not provided"). Explicit names, never `secrets: inherit`. Checked by scripts/lib/workflows.test.ts.
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      SUPABASE_DB_URL:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations + Edge Functions (production)
    runs-on: ubuntu-latest
    # Upper bound so a hung CLI / network call cannot hold the production-release group for GitHub's 6 h default.
    # Waiting for the environment approval does not count. When the job timeout fires inside `db push`, the runner kills
    # it exactly like a Cancel: the outcome of the migration file in flight is UNCERTAIN (it may have been committed or
    # rolled back, and the database may still be executing it after the runner is gone), files committed before it
    # stay, so a stage can be left partially applied. Recovery: RELEASE.md "Прерванный db push (Cancel или таймаут)" —
    # never a blind re-run. Every pre-push step below therefore has its own bound, so the job budget cannot be used up
    # before db push (budget, all in minutes, kept consistent by scripts/lib/workflows.test.ts):
    #   pre-push steps (non-mutating, each bounded)  65  = sum of their step timeouts, incl. the budget check
    #   reserve: Apply migrations + Verify            60  no step timeout (a database mutation is never cut short)
    #   Edge Functions: 4 × 10 + list 5               45
    #   runner margin (set up job, post steps)        10
    #   job timeout                                   180 (GitHub maximum 360)
    # The step bounds alone do not prove the reserve: the step "Time budget left for db push" measures the real time
    # since the guard and refuses to start the push after minute 65 (fail-closed, before any database change).
    timeout-minutes: 180
    # Secrets live in the `production` environment: they are released only after the owner's approval and only to
    # runs from main (environment deployment branch policy). The `if` keeps a run from any other ref from even asking.
    if: github.ref == 'refs/heads/main'
    environment: production
    # Least exposure: the job env holds only the (non-secret) project ref. Each production secret is passed through
    # the env of exactly the steps that need it — never to checkout, pnpm install (dependency install scripts), the
    # integrity check, the gate's plan / stage checks or any other step:
    #   SUPABASE_ACCESS_TOKEN — supabase link, functions deploy / list (Management API);
    #   SUPABASE_DB_PASSWORD  — supabase link only;
    #   SUPABASE_DB_URL       — Session Pooler validation, migration list, dry-run, db push, verify-applied.
    # GitHub masks secret values in logs; no step prints them.
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Defence in depth, before checkout and before any secret is used: main, a manual dispatch of release.yml on
      # main (github.workflow_ref is the CALLER's workflow), and the full SHA of that run.
      - name: Guard — called by release.yml on main for the run's SHA
        timeout-minutes: 2
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          EXPECTED_CALLER: ${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        run: |
          set -euo pipefail
          # Start of the measured job time (first step), read by "Time budget left for db push".
          echo "DEPLOY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::refusing: ref $GITHUB_REF is not refs/heads/main"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then echo "::error::refusing: event $GITHUB_EVENT_NAME"; exit 1; fi
          if [ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_CALLER" ]; then echo "::error::refusing: caller $GITHUB_WORKFLOW_REF is not $EXPECTED_CALLER"; exit 1; fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::refusing: sha is not a full commit SHA"; exit 1; fi
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then echo "::error::refusing: sha $RELEASE_SHA is not the run commit $GITHUB_SHA"; exit 1; fi
          echo "Supabase release of $RELEASE_SHA from $GITHUB_WORKFLOW_REF"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
        timeout-minutes: 5
      - name: Checked-out commit is the release SHA
        timeout-minutes: 1
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
        timeout-minutes: 5
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      # SHA-256 of every reviewed migration (scripts/lib/migration-integrity-manifest.ts) before anything touches the
      # database: exact file set, valid UTF-8, CRLF→LF canonical content equal to the approved hash.
      - name: Verify migration file integrity (SHA-256)
        timeout-minutes: 5
        run: pnpm check:migration-integrity
      # The configured project ref must be the approved production project (scripts/lib/release.ts
      # PRODUCTION_SUPABASE_PROJECT_REF) before any credential is used with it. No secret in this step.
      - name: Project ref is the approved production project
        timeout-minutes: 2
        run: pnpm exec tsx scripts/release-preflight.ts project-ref
      # Read-only for the remote project (Management API GETs; writes only local supabase/.temp files).
      # Fail fast, before any database access: an empty secret (not passed / not set in `production`) stops here with
      # its NAME only — the value is never printed.
      - name: Link the production project
        timeout-minutes: 5
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is empty in the production environment of this job; refusing to link"; exit 1; fi
          done
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Validate Session Pooler target
        timeout-minutes: 1
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.SUPABASE_DB_URL);
          const expectedUser = `postgres.${process.env.SUPABASE_PROJECT_REF}`;
          if (process.env.SUPABASE_PROJECT_REF !== 'xcbugcjmddtubytpvffa') {
            throw new Error('SUPABASE_PROJECT_REF does not match the approved production project');
          }
          if (!['postgres:', 'postgresql:'].includes(url.protocol) ||
              !url.hostname.endsWith('.pooler.supabase.com') ||
              url.port !== '5432' ||
              decodeURIComponent(url.username) !== expectedUser ||
              url.pathname !== '/postgres' ||
              !url.password) {
            throw new Error('SUPABASE_DB_URL must be the project Session Pooler URI (port 5432, postgres.<project-ref> user, postgres database)');
          }
          console.log('Session Pooler target format and project ref validated.');
          NODE
      - name: Show pending migrations
        timeout-minutes: 5
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL" --agent no
      # Gate (scripts/lib/migration-plan.ts): local file names, remote history AND dry-run (JSON) must agree on one state.
      # `db push` has no version/stage selector: it applies EVERY local migration missing from the remote history, so
      # the gate derives the pending whole stages and requires the dry-run to plan exactly their reviewed files:
      #   apply — baseline (incl. 2026-10-26) applied; pending = whole stages 3A+3B (one push, 3A first) or 3B only;
      #   skip  — baseline, 3A and 3B confirmed applied, nothing pending, dry-run up to date (repeat run).
      # Anything else (partial stage, 3B before 3A, unknown/missing/renamed file, inconsistent history, CLI error)
      # stops before db push. Every `check-production-migration-plan.ts` call also re-reads and re-hashes all
      # migration files first (SHA-256 integrity), so content changed after any earlier step stops the job too.
      - name: Read migration history and dry-run plan
        timeout-minutes: 10
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL" --agent no --output-format json \
            > "$RUNNER_TEMP/migration-list.json" || { cat "$RUNNER_TEMP/migration-list.json"; exit 1; }
          pnpm exec supabase db push --dry-run --db-url "$SUPABASE_DB_URL" --agent no --output-format json \
            > "$RUNNER_TEMP/db-push-dry-run.json" || { cat "$RUNNER_TEMP/db-push-dry-run.json"; exit 1; }
          cat "$RUNNER_TEMP/db-push-dry-run.json"
      - name: Validate migration plan
        id: plan
        timeout-minutes: 5
        run: pnpm exec tsx scripts/check-production-migration-plan.ts plan "$RUNNER_TEMP/migration-list.json" "$RUNNER_TEMP/db-push-dry-run.json"
      # Release allowlist (scripts/lib/release.ts RELEASE_ALLOWED_STAGES): only Expand stages may be pushed by a
      # release. A Contract stage (3C) in the plan stops the job before db push; the apply step re-checks that the
      # plan is still exactly these stages.
      - name: Planned stages are release-allowed (no Contract stage)
        timeout-minutes: 2
        env:
          PLANNED_STAGES: ${{ steps.plan.outputs.stages }}
        run: pnpm exec tsx scripts/release-preflight.ts stages "$PLANNED_STAGES"
      # The last non-mutating step before db push. The step bounds above cap the pre-push time at 65 minutes on paper;
      # this measures it: if more than 65 minutes (job timeout − reserve − Edge Functions − margin) passed since the
      # guard — unbounded overhead, a new step without a bound — the push does not start, so it always keeps the
      # Apply + Verify reserve and the Edge Function steps keep their budget inside the job timeout. The values must
      # match the job budget above (scripts/lib/workflows.test.ts).
      - name: Time budget left for db push
        if: steps.plan.outputs.mode == 'apply'
        timeout-minutes: 2
        env:
          JOB_TIMEOUT_MINUTES: '180'
          PUSH_RESERVE_MINUTES: '60'
          FUNCTIONS_MINUTES: '45'
          RUNNER_MARGIN_MINUTES: '10'
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOY_JOB_STARTED_AT:-}" =~ ^[0-9]+$ ]]; then echo "::error::job start time not recorded; refusing to start db push"; exit 1; fi
          latest=$(( JOB_TIMEOUT_MINUTES - PUSH_RESERVE_MINUTES - FUNCTIONS_MINUTES - RUNNER_MARGIN_MINUTES ))
          elapsed=$(( $(date +%s) - DEPLOY_JOB_STARTED_AT ))
          if [ "$latest" -le 0 ] || [ "$elapsed" -lt 0 ] || [ "$elapsed" -gt $(( latest * 60 )) ]; then
            echo "::error::${elapsed}s since the guard; db push may start only within ${latest} min. Refusing to start db push (nothing was changed)."
            exit 1
          fi
          echo "db push may start: ${elapsed}s since the guard (limit ${latest} min); reserve ${PUSH_RESERVE_MINUTES} min for Apply + Verify, ${FUNCTIONS_MINUTES} min for Edge Functions"
      - name: Apply migrations
        if: steps.plan.outputs.mode == 'apply'
        env:
          PLANNED_STAGES: ${{ steps.plan.outputs.stages }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Re-check right before the push: file integrity (re-hashed from disk, no cached result), then history and
          # dry-run; it must still be an apply of exactly the planned stages. The `plan --expect-stages` call hashes
          # the files once more, as the last step before `db push`.
          pnpm check:migration-integrity
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL" --agent no --output-format json \
            > "$RUNNER_TEMP/migration-list-recheck.json" || { cat "$RUNNER_TEMP/migration-list-recheck.json"; exit 1; }
          pnpm exec supabase db push --dry-run --db-url "$SUPABASE_DB_URL" --agent no --output-format json \
            > "$RUNNER_TEMP/db-push-dry-run-recheck.json" || { cat "$RUNNER_TEMP/db-push-dry-run-recheck.json"; exit 1; }
          pnpm exec tsx scripts/check-production-migration-plan.ts plan "$RUNNER_TEMP/migration-list-recheck.json" \
            "$RUNNER_TEMP/db-push-dry-run-recheck.json" --expect-stages "$PLANNED_STAGES"
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Verify migration history after push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL" --agent no --output-format json \
            > "$RUNNER_TEMP/migration-list-after.json" || { cat "$RUNNER_TEMP/migration-list-after.json"; exit 1; }
          pnpm exec tsx scripts/check-production-migration-plan.ts verify-applied "$RUNNER_TEMP/migration-list-after.json"
      # Edge Functions: one step per function, in sequence, no database access. Not atomic as a set: a failure stops the
      # job after the functions before it are already live (RELEASE.md "Частичный деплой Edge Functions").
      - name: Deploy Edge Function checkout
        timeout-minutes: 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy checkout --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Function my-orders
        timeout-minutes: 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy my-orders --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Function notification-settings
        timeout-minutes: 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy notification-settings --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Function platform-admin
        timeout-minutes: 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy platform-admin --project-ref "$SUPABASE_PROJECT_REF"
      - name: List deployed Edge Functions
        timeout-minutes: 5
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --agent no
