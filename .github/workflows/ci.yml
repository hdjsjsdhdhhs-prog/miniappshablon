name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only verifies code: no job here deploys anything, uses an environment or reads a secret. Production releases
# (Supabase, then Cloudflare Pages) run only through the manual, approved .github/workflows/release.yml, which
# requires this workflow to be green for the released SHA. Checked by scripts/lib/workflows.test.ts.
permissions:
  contents: read

jobs:
  quality:
    name: Lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:tenant-names
      - run: pnpm check:migration-integrity
      - name: Validate every tenant config
        run: for d in tenants/*/; do pnpm -s tenant:validate --slug "$(basename "$d")"; done
      - name: Build (public values only)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: pnpm build
      - run: pnpm check:bundle-secrets

  edge-functions-deno-check:
    name: Edge Functions · deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Deno as the Supabase Edge Runtime of the pinned CLI (edge-runtime v1.77.4 → deno 2.1.4); the wrapper
      # refuses any other version. Action pinned by commit SHA (tag v2.0.5).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4
      # Every function's index.ts + every non-test _shared module; --no-config, frozen lock (scripts/lib/edge-functions.ts).
      - name: deno check (all Edge Functions + _shared)
        run: pnpm check:edge-functions
      - name: Working tree is unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  integration:
    name: SQL/integration + Playwright (local Supabase in Docker)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies migrations from Git)
        run: pnpm db:start
      - name: Migrations reproduce the schema
        # The CLI prints the verdict to stderr (stdout only carries JSON), so capture both streams.
        run: pnpm exec supabase db diff --local 2>&1 | tee diff.txt && grep -q "No schema changes found" diff.txt
      - name: Seed and publish demo tenants
        run: |
          for slug in noir-vapor mint-lab; do
            pnpm -s tenant:seed --slug "$slug"
            OWNER_PASSWORD="ci-$(openssl rand -hex 12)" pnpm -s owner:add --slug "$slug" --email "ci-owner@$slug.local"
            pnpm -s tenant:publish --slug "$slug" --yes
            pnpm -s tenant:verify --slug "$slug"
          done
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
